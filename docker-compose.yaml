services:
  mysql:
    image: mysql:8.4
    container_name: video-feed-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: local_root_password
      MYSQL_DATABASE: video_feed
      MYSQL_USER: video_feed
      MYSQL_PASSWORD: video_feed_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
  redis:
    image: redis:7-alpine
    container_name: video-feed-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
  rabbitmq:
    image: rabbitmq:4-management
    container_name: video-feed-rabbitmq
    hostname: ebfbc013399a
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "127.0.0.1:18072:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
volumes:
  mysql_data:
  rabbitmq_data:
